<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're offline - Luxury Intelligence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f7f9fb;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
    }
    
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #1a1a1a;
    }
    
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #4a5568;
      margin-bottom: 2rem;
    }
    
    .retry-link {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #6b2d5c;
      color: #ffffff;
      text-decoration: none;
      border-radius: 0.375rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .retry-link:hover {
      background: #5a2550;
    }
    
    .retry-link:active {
      background: #4a1f42;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're offline</h1>
    <p>This page needs an internet connection. Please try again.</p>
    <a href="/" class="retry-link">Retry</a>
  </div>
</body>
</html>
